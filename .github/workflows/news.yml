name: Global News Bot

on:
  schedule:
    # 10:00 in Türkiye (UTC+3), once daily
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed parser
        run: pip install feedparser

      - name: Post daily regional headlines
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python - <<'PY'
          import calendar
          import html
          import json
          import os
          import re
          import time
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          import feedparser

          MAX_POSTS = 18
          STATE_FILE = Path("state.json")

          # Two slots per confirmed zone; no zone can dominate the digest.
          REGION_LIMITS = {
              "Africa": 2,
              "Middle East": 2,
              "Central Asia": 2,
              "South Asia": 2,
              "Southeast Asia": 2,
              "Europe and Russia": 2,
              "North America": 2,
              "South America": 2,
              "Oceania": 2,
          }

          FEEDS = {
              "Africa": {
                  "Africanews": "https://www.africanews.com/feed/rss",
                  "Daily Trust": "https://dailytrust.com/feed/",
                  "Morocco World News": "https://www.moroccoworldnews.com/feed",
                  "Daily Maverick": "https://www.dailymaverick.co.za/feed/",
              },
              "Middle East": {
                  "Al Jazeera": "https://www.aljazeera.com/xml/rss/all.xml",
                  "Anadolu Agency": "https://www.aa.com.tr/tr/rss/default?cat=dunya",
                  "Daily Sabah": "https://www.dailysabah.com/rss",
                  "Press TV": "https://www.presstv.ir/rss.xml",
                  "Mehr News": "https://en.mehrnews.com/rss",
              },
              "Central Asia": {
                  "Kabar": "https://en.kabar.kg/rss/",
                  "Daryo": "https://daryo.uz/en/feed",
                  "Kun.uz": "https://kun.uz/news/rss",
                  "Pressa Tajikistan": "https://pressa.tj/ru/feed",
              },
              "South Asia": {
                  "Express Tribune": "https://tribune.com.pk/feed/home",
                  "The Daily Star": "https://www.thedailystar.net/frontpage/rss.xml",
              },
              "Southeast Asia": {
                  "Malay Mail": "https://www.malaymail.com/feed/rss/malaysia",
                  "Free Malaysia Today": "https://www.freemalaysiatoday.com/feed/",
              },
              "Europe and Russia": {
                  "TASS": "https://tass.com/rss/v2.xml",
                  "Sarajevo Times": "https://sarajevotimes.com/feed/",
              },
              "North America": {
                  "Zeteo": "https://zeteo.com/feed",
                  "CBC": "https://www.cbc.ca/webfeed/rss/rss-topstories",
              },
              "South America": {
                  "MercoPress": "https://en.mercopress.com/rss/",
                  "The Rio Times": "https://www.riotimesonline.com/feed/",
              },
              "Oceania": {
                  "RNZ News": "https://www.rnz.co.nz/rss/news.xml",
                  "ABC News Australia": "https://www.abc.net.au/news/feed/46182/rss.xml",
              },
          }

          if STATE_FILE.exists():
              try:
                  saved = json.loads(STATE_FILE.read_text(encoding="utf-8-sig"))
              except (json.JSONDecodeError, OSError):
                  saved = {}
          else:
              saved = {}

          if isinstance(saved, list):
              seen_order = saved
          elif isinstance(saved, dict):
              seen_order = []
              for key in ("seen", "posted_ids", "processed", "articles"):
                  if isinstance(saved.get(key), list):
                      seen_order = saved[key]
                      break
          else:
              seen_order = []

          seen_order = [str(item) for item in seen_order]
          seen = set(seen_order)

          def get_timestamp(entry):
              value = entry.get("published_parsed") or entry.get("updated_parsed")
              if value:
                  try:
                      return calendar.timegm(value)
                  except (TypeError, ValueError, OverflowError):
                      pass
              return 0

          def get_image(entry):
              for media in entry.get("media_content", []):
                  url = media.get("url", "").strip()
                  media_type = media.get("type", "")
                  medium = media.get("medium", "")
                  if url and medium in ("", "image") and (not media_type or media_type.startswith("image/")):
                      return html.unescape(url)

              for media in entry.get("media_thumbnail", []):
                  url = media.get("url", "").strip()
                  if url:
                      return html.unescape(url)

              for enclosure in entry.get("enclosures", []):
                  url = (enclosure.get("href") or enclosure.get("url") or "").strip()
                  media_type = enclosure.get("type", "")
                  if url and (media_type.startswith("image/") or re.search(r"\.(jpe?g|png|webp)(\?|$)", url, re.I)):
                      return html.unescape(url)

              image = entry.get("image", {})
              if isinstance(image, dict) and image.get("href"):
                  return html.unescape(image["href"].strip())

              content_parts = [entry.get("summary", ""), entry.get("description", "")]
              for content in entry.get("content", []):
                  content_parts.append(content.get("value", ""))
              match = re.search(
                  r'''<img[^>]+src=["']([^"']+)["']''',
                  " ".join(content_parts),
                  re.I,
              )
              if match:
                  return html.unescape(match.group(1))
              return None

          def fetch_headline(region, source, url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (compatible; DailyNewsBot/1.0)"},
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  parsed = feedparser.parse(response.read())

              for entry in parsed.entries:
                  title = " ".join(entry.get("title", "").split())
                  link = entry.get("link", "").strip()
                  if not title or not link:
                      continue

                  article_id = str(entry.get("id") or link)
                  if article_id in seen or link in seen:
                      continue

                  return {
                      "region": region,
                      "source": source,
                      "title": title[:350],
                      "link": link,
                      "id": article_id,
                      "image": get_image(entry),
                      "timestamp": get_timestamp(entry),
                  }
              return None

          candidates = []
          with ThreadPoolExecutor(max_workers=8) as executor:
              futures = {}
              for region, sources in FEEDS.items():
                  for source, url in sources.items():
                      future = executor.submit(fetch_headline, region, source, url)
                      futures[future] = (region, source)

              for future in as_completed(futures):
                  region, source = futures[future]
                  try:
                      article = future.result()
                      if article:
                          candidates.append(article)
                  except Exception as error:
                      print(f"Feed failed: {source}: {error}")

          selected = []
          batch_ids = set()
          batch_links = set()

          for region, limit in REGION_LIMITS.items():
              regional = [item for item in candidates if item["region"] == region]
              regional.sort(
                  key=lambda item: (item["timestamp"], item["source"]),
                  reverse=True,
              )
              for article in regional:
                  if article["id"] in batch_ids or article["link"] in batch_links:
                      continue
                  selected.append(article)
                  batch_ids.add(article["id"])
                  batch_links.add(article["link"])
                  if len([item for item in selected if item["region"] == region]) >= limit:
                      break
                  if len(selected) >= MAX_POSTS:
                      break

          if not selected:
              print("No new headlines found.")
              raise SystemExit(0)

          turkey_time = datetime.now(timezone(timedelta(hours=3)))
          header = (
              "<b>🌍 Daily World Headlines</b>\n"
              + turkey_time.strftime("%d %B %Y")
              + f"\n{len(selected)} headlines • Two per zone when available"
          )

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          channel = os.environ["CHANNEL_ID"]

          def call_telegram(method, payload):
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/{method}",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=40) as response:
                  result = json.loads(response.read().decode("utf-8"))
              if not result.get("ok"):
                  raise RuntimeError(f"Telegram rejected {method}: {result}")
              return result

          call_telegram("sendMessage", {
              "chat_id": channel,
              "text": header,
              "parse_mode": "HTML",
              "disable_web_page_preview": True,
          })

          for number, article in enumerate(selected, start=1):
              region = html.escape(article["region"])
              source = html.escape(article["source"])
              title = html.escape(article["title"])
              link = html.escape(article["link"], quote=True)
              caption = (
                  f"<b>{region}</b>\n"
                  f'<a href="{link}">{title}</a>\n'
                  f"— {source}"
              )

              posted_with_image = False
              if article.get("image"):
                  try:
                      call_telegram("sendPhoto", {
                          "chat_id": channel,
                          "photo": article["image"],
                          "caption": caption,
                          "parse_mode": "HTML",
                      })
                      posted_with_image = True
                  except RuntimeError as error:
                      print(f"Photo failed for {article['source']}; using article preview: {error}")

              if not posted_with_image:
                  preview_text = (
                      f"<b>{region}</b>\n"
                      f"{title}\n"
                      f"— {source}\n"
                      f"{link}"
                  )
                  call_telegram("sendMessage", {
                      "chat_id": channel,
                      "text": preview_text,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": False,
                  })

              for identifier in (article["id"], article["link"]):
                  if identifier not in seen:
                      seen.add(identifier)
                      seen_order.append(identifier)

              STATE_FILE.write_text(
                  json.dumps({"seen": seen_order[-5000:]}, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )
              style = "photo" if posted_with_image else "article preview"
              print(f"Posted {number}/{len(selected)}: {article['source']} ({style}).")
              time.sleep(1)

          print(f"Daily headlines complete: {len(selected)} articles posted.")
          PY

      - name: Save processed article IDs
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update news state"
              git pull --rebase origin main
              git push
            fi
          fi
